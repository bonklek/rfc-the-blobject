<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Figure 3 — A shorter lease removes only the fixed-system tail</title>
<desc id="desc">One fixed-size blob, identical publication burden, and two protocol serving policies.</desc>
<style>
text{font-family:Inter,system-ui,sans-serif;fill:#172033}
.title{font-size:22px;font-weight:600}.subtitle{font-size:13px}
.label{font-size:13px}.small{font-size:12px}.tiny{font-size:11px}
.muted{fill:#667085}.axis{stroke:#172033;stroke-width:1}
.grid{stroke:#d8dee9;stroke-width:1}.frame{fill:#fff;stroke:#d8dee9}
</style>
<rect width="100%" height="100%" fill="#fff"/>
<text class="title" x="32" y="34">Figure 3 — A shorter lease removes only the fixed-system tail</text>
<text class="subtitle muted" x="32" y="56">One fixed-size blob, identical publication burden, and two protocol serving policies.</text>
<rect class="frame" x="245" y="112" width="907" height="210"/>
<text class="label" x="227" y="166" text-anchor="end">Fixed retention</text>
<rect x="245" y="145" width="907.0" height="42" fill="#dbeafe" stroke="#2563eb"/>
<line x1="245" y1="137" x2="245" y2="195" stroke="#172033" stroke-width="3"/>
<text class="label" x="227" y="266" text-anchor="end">Variable retention</text>
<rect x="245" y="245" width="358.8" height="42" fill="#dbeafe" stroke="#2563eb"/>
<line x1="245" y1="237" x2="245" y2="295" stroke="#172033" stroke-width="3"/>
<rect x="603.8" y="245" width="548.2" height="42" fill="#ede9fe" stroke="#7c3aed" stroke-dasharray="7 5"/>
<text class="label" x="877.9" y="271" text-anchor="middle">fixed-only tail removed</text>
<text class="small" x="245" y="128">same fixed-blob ingress and availability-establishment burden</text>
<text class="small" x="603.8" y="232" text-anchor="middle">chosen T</text>
<text class="small" x="1152.0" y="132" text-anchor="end">H = 4096 epochs</text>
<line class="axis" x1="245" y1="322" x2="1152" y2="322"/>
<line class="axis" x1="245.0" y1="322" x2="245.0" y2="327"/>
<text class="tiny" x="245.0" y="343" text-anchor="middle">0</text>
<line class="axis" x1="444.3" y1="322" x2="444.3" y2="327"/>
<text class="tiny" x="444.3" y="343" text-anchor="middle">4</text>
<line class="axis" x1="643.7" y1="322" x2="643.7" y2="327"/>
<text class="tiny" x="643.7" y="343" text-anchor="middle">8</text>
<line class="axis" x1="843.0" y1="322" x2="843.0" y2="327"/>
<text class="tiny" x="843.0" y="343" text-anchor="middle">12</text>
<line class="axis" x1="1042.4" y1="322" x2="1042.4" y2="327"/>
<text class="tiny" x="1042.4" y="343" text-anchor="middle">16</text>
<line class="axis" x1="1152.0" y1="322" x2="1152.0" y2="327"/>
<text class="tiny" x="1152.0" y="343" text-anchor="middle">18.2</text>
<text class="small" x="698.5" y="370" text-anchor="middle">Time since publication (days)</text>
<text class="small muted" x="32" y="407">The saving is logical retained byte-time; physical implementation overhead is evaluated separately.</text>
</svg>
